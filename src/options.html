<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="css/options.css" />
    <script src="js/browser-polyfill.min.js"></script>
    <title>Settings</title>
</head>

<body>
    <header>
        <h1>FitLayout</h1>
    </header>
    <div class="settings">
        <h2>FitLayout browser extension: Profile settings</h2>
        <div class="profiles">
            <div class="field-group">
                <label for="profile" class="field-label">Select server / profile</label>
                <select id="profile" class="select-input profile">
                    <option value="277470f8-f37f-4be4-b469-7ecb8a58ce8b">layout.fit.vutbr.cz/api/r/../run/renderJson
                    </option>
                    <option value="277470f8-f37f-4be4-b469-7ecb8a58ce8b">layout.fit.vutbr.cz/api/r/../run/tagJson</option>
                    <option value="UID3">server3</option>
                </select>
            </div>
            <div class="button-row">
                <button class="btn btn-accent" id="deleteItem">Delete profile</button>
                <button class="btn btn-danger" id="clearStorage">Delete all saved data</button>
            </div>
        </div>
    </div>
    <script src="options.js"></script>
</body>

</html>
