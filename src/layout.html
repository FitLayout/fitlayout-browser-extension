<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/browser-polyfill.min.js"></script>
</head>

<body>
    <header>
        <img src="img/icon128.png" alt="" width="32" height="32" />
        <span>FitLayout</span>
    </header>
    <main>
        <form>
            <div class="input-container">
                <input type="text" class="text-input" id="hostname" placeholder=" "
                    value="localhost/api/r/../run/renderJson" />
                <label for="hostname" class="float-label">Hostname</label>
            </div>

            <div class="input-container">
                <input type="text" class="text-input" id="UID" placeholder=" "
                    value="6f0fafee-e048-46d5-a217-54064f09700e" />
                <label for="UID" class="float-label">UID</label>
            </div>

            <div class="field-group">
                <label for="activeLayer" class="field-label">Active Layer</label>
                <select id="activeLayer" class="select-input activeLayer">
                    <option value="auto">Foreground</option>
                    <option value="none">Background</option>
                </select>
            </div>

            <label class="checkbox-label">
                <input type="checkbox" id="saveCheck" class="save-checkbox" />
                Save?
            </label>

            <div class="field-group">
                <label for="profile" class="field-label">Select server / profile</label>
                <select id="profile" class="select-input profile">
                    <option value="6f0fafee-e048-46d5-a217-54064f09700e">
                        localhost/api/r/../run/renderJson</option>
                    <option value="277470f8-f37f-4be4-b469-7ecb8a58ce8b">
                        layout.fit.vutbr.cz/api/r/../run/renderJson</option>
                    <option value="277470f8-f37f-4be4-b469-7ecb8a58ce8b">
                        layout.fit.vutbr.cz/api/r/../run/tagJson</option>
                    <option value="UID3">server3</option>
                </select>
            </div>

            <div class="button-row">
                <button type="button" id="sendJson" class="btn btn-accent">Send</button>
            </div>

            <div class="loading">
                <div id="p2" class="progress hidden"></div>
            </div>

            <div class="input-container">
                <textarea id="serverData" class="text-input" placeholder=" ">Server data!</textarea>
                <label for="serverData" class="float-label">Output log</label>
            </div>

            <div class="button-row">
                <button type="button" id="settingsButton" class="btn btn-accent">Settings</button>
                <button class="btn" type="reset">Reset</button>
            </div>
        </form>
    </main>
    <script src="popup.js"></script>
</body>

</html>
